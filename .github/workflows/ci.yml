name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check architecture boundaries
        run: python scripts/check_architecture.py
      - name: Restore
        run: dotnet restore LastMile.sln
      - name: Build
        run: dotnet build LastMile.sln --no-restore --configuration Release
      - name: Diagnose EF snapshot drift
        if: failure()
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          dotnet ef migrations add SnapshotDiagnostic --project src/LastMile.Infrastructure --startup-project src/LastMile.Api --output-dir Persistence/Migrations
          git diff -- src/LastMile.Infrastructure/Persistence/Migrations
      - name: Test
        run: dotnet test LastMile.sln --no-build --configuration Release --logger "trx;LogFileName=tests.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-snapshot-diagnostic
          path: src/LastMile.Infrastructure/Persistence/Migrations/
      - name: Check vulnerable dependencies
        run: dotnet list LastMile.sln package --vulnerable --include-transitive
